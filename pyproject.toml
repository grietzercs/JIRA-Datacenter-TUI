[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-tui"
version = "0.1.0"
description = "Keyboard-driven terminal UI for Jira Server / Data Center (sprints, backlog, JQL search, issue detail, create)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=8.0,<9",
    "httpx>=0.27",
    "rich>=13",
    "keyring>=24",
    "certifi",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
jiratui = "jiratui.__main__:main"

[tool.setuptools.packages.find]
include = ["jiratui*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
